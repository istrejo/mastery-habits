<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Pendie - Login</title>

                    "spacing": {

                        "lg": "24px",

                        "xs": "4px",
                        "sm": "8px",
                        "margin-mobile": "16px",
                        "gutter": "16px",

                    },
                    "fontFamily": {

                        "title-lg": ["Inter"],

<body class="bg-background text-on-background min-h-screen flex flex-col justify-center items-center p-margin-mobile antialiased">
<main class="w-full max-w-[400px]">
<!-- Brand Header -->
<div class="flex flex-col items-center mb-xl">
<div class="flex items-center gap-xs text-primary mb-sm">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">lock</span>
<h1 class="font-display text-display">Pendie</h1>
</div>
<h2 class="font-headline-lg text-headline-lg md:font-headline-lg md:text-headline-lg text-on-surface">Welcome back</h2>
</div>
<!-- Login Card -->
<div class="bg-surface border border-outline-variant rounded-xl p-lg md:p-xl w-full">
<form action="#" class="space-y-lg" method="POST">
<!-- Email Input (Floating Label) -->
<div class="relative">
<input class="block w-full px-md pt-6 pb-2 text-body-lg text-on-surface bg-transparent border border-outline rounded-lg appearance-none focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent peer" id="email" name="email" placeholder=" " required="" type="email">
<label class="absolute text-body-md text-outline duration-300 transform -translate-y-3 scale-75 top-4 z-10 origin-[0] left-4 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-3 peer-focus:text-primary bg-surface px-1" for="email">Email</label>
</div>
<!-- Password Input (Floating Label) -->
<div class="relative">
<input class="block w-full px-md pt-6 pb-2 text-body-lg text-on-surface bg-transparent border border-outline rounded-lg appearance-none focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent peer" id="password" name="password" placeholder=" " required="" type="password">
<label class="absolute text-body-md text-outline duration-300 transform -translate-y-3 scale-75 top-4 z-10 origin-[0] left-4 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-3 peer-focus:text-primary bg-surface px-1" for="password">Password</label>
</div>
<!-- Forgot Password -->
<div class="flex items-center justify-end">
<a class="font-label-md text-label-md text-primary hover:underline focus:outline-none focus:ring-2 focus:ring-primary rounded-sm" href="#">Forgot Password?</a>
</div>
<!-- Sign In Button -->
<button class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg text-on-primary bg-primary font-label-md text-label-md uppercase tracking-widest hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-opacity" type="submit">
                    Sign In
                </button>
<!-- Divider -->
<div class="relative flex items-center py-xs">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 font-body-md text-body-md text-outline">or</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Google Sign In -->
<button class="w-full flex justify-center items-center gap-sm py-3 px-4 border border-outline rounded-lg text-on-surface bg-transparent font-label-md text-label-md uppercase tracking-widest hover:bg-surface-container-low focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors" type="button">
<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25C22.56 11.47 22.49 10.72 22.36 10H12V14.26H17.92C17.66 15.63 16.88 16.8 15.71 17.58V20.34H19.28C21.36 18.42 22.56 15.6 22.56 12.25Z" fill="#4285F4"></path>
<path d="M12 23C14.97 23 17.46 22.02 19.28 20.34L15.71 17.58C14.73 18.24 13.48 18.64 12 18.64C9.14 18.64 6.7 16.71 5.84 14.12H2.15V16.98C3.96 20.58 7.7 23 12 23Z" fill="#34A853"></path>
<path d="M5.84 14.12C5.62 13.46 5.5 12.75 5.5 12C5.5 11.25 5.62 10.54 5.84 9.88V7.02H2.15C1.41 8.5 1 10.2 1 12C1 13.8 1.41 15.5 2.15 16.98L5.84 14.12Z" fill="#FBBC05"></path>
<path d="M12 5.36C13.62 5.36 15.06 5.92 16.2 7.02L19.36 3.86C17.46 2.09 14.97 1 12 1C7.7 1 3.96 3.42 2.15 7.02L5.84 9.88C6.7 7.29 9.14 5.36 12 5.36Z" fill="#EA4335"></path>
</svg>
                    Sign in with Google
                </button>
</form>
</div>
<!-- Sign Up Link -->
<div class="mt-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="font-label-md text-label-md text-primary hover:underline focus:outline-none focus:ring-2 focus:ring-primary rounded-sm" href="#">Sign Up</a>
</p>
</div>
</main>
</body></html>
