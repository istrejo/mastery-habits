<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden font-body-lg text-body-lg">
<!-- Ambient Background Elements for Depth -->
<div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none">
<div class="absolute -top-1/4 -left-1/4 w-1/2 h-1/2 bg-primary/10 rounded-full blur-3xl opacity-60"></div>
<div class="absolute bottom-0 right-0 w-1/3 h-1/3 bg-primary-fixed-dim/10 rounded-full blur-3xl opacity-50"></div>
</div>
<!-- Sign Up Card -->
<!-- Level 2 Depth (Active/Floating style for isolated task) -->
<main class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl shadow-[0_10px_15px_-3px_rgba(0,0,0,0.5)] border border-outline-variant p-lg md:p-xl relative z-10 flex flex-col gap-xl">
<!-- Header -->
<header class="flex flex-col items-center text-center gap-sm">
<div class="font-display text-display text-primary flex items-center gap-xs tracking-tight">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1; font-size: 32px;">lock</span>
                Pendie
            </div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mt-sm">
                Create your account
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                Join us to achieve calm control over your tasks.
            </p>
</header>
<!-- Form -->
<form class="flex flex-col gap-md">
<!-- Full Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="fullName">Full Name</label>
<input class="w-full bg-background border border-outline rounded text-on-surface font-body-md text-body-md px-sm py-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline" id="fullName" name="fullName" placeholder="Jane Doe" required="" type="text">
</div>
<!-- Email -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<input class="w-full bg-background border border-outline rounded text-on-surface font-body-md text-body-md px-sm py-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline" id="email" name="email" placeholder="jane@example.com" required="" type="email">
</div>
<!-- Password -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative">
<input class="w-full bg-background border border-outline rounded text-on-surface font-body-md text-body-md pl-sm pr-10 py-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-2 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" style="font-size: 20px;">visibility_off</span>
</button>
</div>
<p class="font-body-md text-body-md text-outline text-xs mt-1">Must be at least 8 characters long.</p>
</div>
<!-- Primary Action -->
<button class="w-full bg-[#2563eb] text-white font-label-md text-label-md py-sm px-md rounded hover:opacity-90 transition-opacity flex justify-center items-center mt-sm" type="submit">
                Create Account
            </button>
<!-- Divider -->
<div class="flex items-center gap-sm my-xs">
<div class="h-px bg-outline-variant flex-1"></div>
<span class="font-body-md text-body-md text-on-surface-variant text-sm">or</span>
<div class="h-px bg-outline-variant flex-1"></div>
</div>
<!-- Secondary Action -->
<button class="w-full bg-background border border-outline-variant text-on-surface font-label-md text-label-md py-sm px-md rounded hover:bg-surface-container-highest transition-colors flex justify-center items-center gap-sm" type="button">
<span class="material-symbols-outlined" style="font-size: 20px;">account_circle</span>
                Sign up with Google
            </button>
</form>
<!-- Footer Info -->
<div class="flex flex-col items-center gap-md text-center mt-sm">
<p class="font-body-md text-body-md text-on-surface-variant text-xs">
                By creating an account, you agree to our 
                <a class="text-primary hover:underline focus:outline-none focus:ring-2 focus:ring-primary rounded" href="#">Terms of Service</a> and 
                <a class="text-primary hover:underline focus:outline-none focus:ring-2 focus:ring-primary rounded" href="#">Privacy Policy</a>.
            </p>
<p class="font-body-md text-body-md text-on-surface">
                Already have an account? 
                <a class="font-label-md text-label-md text-primary hover:underline focus:outline-none focus:ring-2 focus:ring-primary rounded ml-1" href="#">Log In</a>
</p>
</div>
