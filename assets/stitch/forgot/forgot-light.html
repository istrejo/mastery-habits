<body class="min-h-screen flex flex-col items-center justify-center bg-background px-margin-mobile antialiased">
<!-- Top App Bar - Simplified for Auth Flow -->
<header class="fixed top-0 w-full flex items-center justify-center px-margin-mobile py-sm bg-background dark:bg-background z-50 flat no shadows docked full-width">
<div class="flex items-center gap-xs text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity scale-95 active:scale-90 transition-transform cursor-pointer">
<span class="material-symbols-outlined text-title-lg" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-display text-display font-bold tracking-tight">Pendie</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-md mt-margin-desktop mb-margin-desktop flex-grow flex flex-col justify-center">
<div class="bg-surface rounded-xl border border-outline-variant/30 p-lg md:p-xl shadow-[0px_10px_15px_-3px_rgba(0,0,0,0.05)]">
<div class="mb-lg text-center">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-surface-container mb-sm">
<span class="material-symbols-outlined text-primary text-title-lg">key</span>
</div>
<h1 class="font-headline-lg text-headline-lg md:font-display md:text-display text-on-surface mb-xs">Reset Password</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enter the email associated with your account and we'll send you a link to reset your password.</p>
</div>
<form class="space-y-md" onsubmit="event.preventDefault();">
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[18px]">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors outline-none" id="email" name="email" placeholder="you@example.com" required="" type="email">
</div>
</div>
<div class="pt-sm">
<button class="w-full flex items-center justify-center gap-xs py-2 px-4 bg-primary text-on-primary rounded-lg font-label-md text-label-md hover:bg-primary-container transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="submit">
<span>Send Link</span>
<span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-lg text-center">
<a class="inline-flex items-center gap-xs font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">
<span class="material-symbols-outlined text-[14px]">arrow_back</span>
                    Back to Login
                </a>
</div>
</div>
</main>
<!-- Footer -->
<footer class="w-full bottom-0 flex flex-col items-center gap-xs py-lg px-margin-mobile bg-transparent flat no shadows mt-auto">
<div class="flex gap-md mb-xs">
<a class="font-label-md text-label-md text-outline hover:text-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary rounded" href="#">Privacy Policy</a>
