<style>
        body {
            background-color: #0D0D0D; /* Enforcing strict dark background as per style guide */
        }
        /* Custom Input Underline Animation */
        .input-underline {
            position: relative;
        }
        .input-underline input {
            border: none;
            border-bottom: 2px solid #262626; /* Enforced structral containment color */
            background-color: transparent;
            border-radius: 0;
            padding-left: 0;
            padding-right: 0;
        }
        .input-underline input:focus {
            outline: none;
            box-shadow: none;
            border-bottom-color: transparent; /* Handled by pseudo-element for animation if desired, but flat here */
        }
        .input-underline::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background-color: #00FF88; /* Primary neon accent */
            transition: width 0.3s ease;
        }
        .input-underline:focus-within::after {
            width: 100%;
        }
        
        /* Suppressing browser auto-fill colors */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #0D0D0D inset !important;
            -webkit-text-fill-color: #e5e2e1 !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="min-h-screen flex flex-col justify-center items-center p-margin-mobile text-on-background">
<!-- Container -->
<main class="w-full max-w-md flex flex-col gap-stack-lg">
<!-- Header -->
<header class="text-left w-full">
<h1 class="font-title-lg text-title-lg text-on-background tracking-tighter uppercase">Create Account</h1>
<p class="font-body-main text-body-main text-secondary mt-stack-sm">Join the elite. Begin your mastery.</p>
</header>
<!-- Form -->
<form class="flex flex-col gap-stack-md w-full">
<!-- Name Input -->
<div class="input-underline w-full flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest" for="name">Name</label>
<input class="w-full py-2 font-body-main text-body-main text-on-background placeholder-secondary-fixed-dim bg-transparent focus:ring-0" id="name" name="name" placeholder="John Doe" required="" type="text"/>
</div>
<!-- Email Input -->
<div class="input-underline w-full flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest" for="email">Email Address</label>
<input class="w-full py-2 font-body-main text-body-main text-on-background placeholder-secondary-fixed-dim bg-transparent focus:ring-0" id="email" name="email" placeholder="john@example.com" required="" type="email"/>
</div>
<!-- Password Input -->
<div class="input-underline w-full flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest" for="password">Password</label>
<input class="w-full py-2 font-body-main text-body-main text-on-background placeholder-secondary-fixed-dim bg-transparent focus:ring-0" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Confirm Password Input -->
<div class="input-underline w-full flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest" for="confirm_password">Confirm Password</label>
<input class="w-full py-2 font-body-main text-body-main text-on-background placeholder-secondary-fixed-dim bg-transparent focus:ring-0" id="confirm_password" name="confirm_password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- CTA Button -->
<button class="w-full bg-primary-container text-background font-title-sm text-title-sm py-4 mt-stack-sm uppercase hover:bg-primary-fixed transition-colors flex items-center justify-center gap-gutter" type="submit">
                CREATE ACCOUNT
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</form>
<!-- Footer -->
<footer class="text-center w-full mt-stack-md">
<p class="font-body-main text-body-main text-secondary">
                Already have an account? 
                <a class="text-primary-container hover:text-primary-fixed transition-colors font-micro-bold text-micro-bold uppercase tracking-widest ml-unit underline underline-offset-4" href="#">Log in</a>
</p>
</footer>
</main>
</body></html>
